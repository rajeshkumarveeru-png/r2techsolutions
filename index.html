<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>R2Tech Solutions | Websites, Software & Business Technology Solutions</title>

    <meta
            name="description"
            content="R2Tech Solutions builds professional websites, custom software, business applications, POS and billing systems, automation solutions and provides dependable technology support for growing businesses."
    />

    <meta
            name="keywords"
            content="R2Tech Solutions, website development, software development, custom software, business applications, POS billing software, Smart Billing, automation, IT solutions, software support, Tamil Nadu"
    />

    <meta name="author" content="R2Tech Solutions" />

    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link
            rel="canonical"
            href="https://r2techsolution.com/"
    />

    <!-- Favicon -->
    <link
            rel="icon"
            type="image/png"
            href="/images/r2-plain.png"
    />

    <link
            rel="apple-touch-icon"
            href="/images/r2-plain.png"
    />

    <!-- Browser theme -->
    <meta
            name="theme-color"
            content="#0b1730"
    />

    <!-- Open Graph / WhatsApp / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />

    <meta
            property="og:title"
            content="R2Tech Solutions | Smart Technology Solutions for Modern Businesses"
    />

    <meta
            property="og:description"
            content="Professional websites, custom software, business applications, POS & billing systems, automation and dependable technical support."
    />

    <meta
            property="og:url"
            content="https://r2techsolution.com/"
    />

    <meta
            property="og:site_name"
            content="R2Tech Solutions"
    />

    <meta
            property="og:image"
            content="https://r2techsolution.com/images/r2-plain.png"
    />

    <meta
            property="og:image:alt"
            content="R2Tech Solutions"
    />

    <!-- X / Twitter -->
    <meta
            name="twitter:card"
            content="summary_large_image"
    />

    <meta
            name="twitter:title"
            content="R2Tech Solutions | Websites, Software & Business Technology"
    />

    <meta
            name="twitter:description"
            content="Websites, custom software, business applications, POS & billing, automation and technology support."
    />

    <meta
            name="twitter:image"
            content="https://r2techsolution.com/images/r2-plain.png"
    />

    <!-- Organization structured data -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Organization",
            "name": "R2Tech Solutions",
            "url": "https://r2techsolution.com/",
            "logo": "https://r2techsolution.com/images/r2-plain.png",
            "description": "R2Tech Solutions provides professional websites, custom software, business applications, POS and billing solutions, automation and technical support.",
            "sameAs": []
        }
    </script>

    <!-- tiny first-paint loader (matches the hero colour so the hand-over is seamless) -->
    <style>
        .boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#070d1d}
        .boot>*{opacity:0;animation:boot-in .5s ease-out .35s forwards}
        .boot-logo{width:56px;height:56px;object-fit:contain}
        .boot-bar{position:relative;width:120px;height:3px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.12)}
        .boot-bar i{position:absolute;inset:0;width:40%;border-radius:inherit;background:linear-gradient(90deg,#2563eb,#f59e0b);animation:boot-slide 1.1s ease-in-out infinite}
        @keyframes boot-in{to{opacity:1}}
        @keyframes boot-slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
        @media (prefers-reduced-motion:reduce){.boot>*{animation:none;opacity:1}.boot-bar i{animation:none;width:100%;opacity:.5}}
    </style>
</head>

<body>
<div id="root">
    <!-- shown only until the app's first render replaces it (no artificial delay); invisible on fast loads -->
    <div class="boot" role="status" aria-label="Loading R2Tech Solutions">
        <img class="boot-logo" src="/images/r2-plain.png" alt="" width="56" height="56" />
        <span class="boot-bar"><i></i></span>
    </div>
</div>

<script
        type="module"
        src="/src/main.tsx"
></script>
</body>
</html>
